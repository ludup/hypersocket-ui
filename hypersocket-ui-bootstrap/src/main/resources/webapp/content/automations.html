<!-- 
	Replace any Automation or Automations with Capitalized name of your resources e.g. Application or Applications
	Replace any automation or automations with lower case name of your resources e.g. application or applications
 -->

<div id="contentAutomations">
	<div class="modal" id="addAutomationForm" tabindex="-1" role="dialog" dialog-for="contentAutomations">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header lb-modal-header-text-reverse">
					<button type="button" class="btn-close" data-bs-dismiss="modal"
						aria-hidden="true"></button>
					<h4 class="modal-title"></h4>
				</div>
				<div class="modal-body">
					<div class="propertyItem form-group row g-2">
						<label class="col-3 control-label" localize="automation.name.label"></label>
						<div class="propertyValue col-9">
							<input type="text" class="form-control"
								 id="resourceName" maxlength="" name="resourceName" value="">
							<div>
								<span class="lb-help-block form-text text-muted mt-2 mb-3 ps-1" localize="automation.name.info"></span>
							</div>
						</div>
					</div>
					<div class="propertyItem form-group row g-2">
						<label class="col-3 control-label" localize="automation.task.label"></label>
						<div id="typeButton" class="propertyValue col-9"></div>
					</div>
					<div id="automationProperties"></div>
					<input type="hidden" id="resourceId" name="resourceId" value="" />
				</div>
				<div class="modal-footer"></div>
			</div>
		</div>
	</div>
</div>
<div id="contentTriggers"></div>
<script type="text/javascript">

	window.triggerMap = window.triggerMap || new Map();
	window.parentMap = window.parentMap || new Map();
	window.elementMap = window.elementMap || new Map();
	window.rootMap = window.rootMap || new Map();
	
	function remoteCallStart() {
		$('#mainContainer').startSpin();
	}
	
	function remoteCallStop() {
		$('#mainContainer').stopSpin();
	}
	
	function drawFlowDiagram(index, resource, element, clean) {
		
		if (clean) {
			element.empty();
		}
		// Here element is the jquery object where you can render the view and resource is the table rows resource.
		element.append(
				'<div data-rootid="' + resource.id + '" id="contentTrigger' + resource.id + '" class="panel panel-default triggerRootContainer" style="display: none;">'
			+	'<div class="spacer20px"></div>'
			+	'	<div class="row g-2">'
			+	'		<div class="col-md-12" style="position:relative;" id="schemeArea' + resource.id + '">'	
			+	'			<div id="triggerTasks' + resource.id + '" style="overflow: auto; height: 300px">'		
			+	'				<div id="rootTrigger' + resource.id + '"></div>'			
			+	'			</div>'		
			+	'			<div class="spacer20px"></div>'		
			+	'		</div>'	
			+	'		<div class="col-md-3" id="triggerArea' + resource.id + '">'
			+	'			<div id="triggerIcons' + resource.id + '"></div>'				
			+	'		</div>'
			+	'	</div>'
			+	'</div>');
		
		const jsPlumbInstanceObj = jsPlumb.getInstance();
		window.jsPlumbInstanceObj = window.jsPlumbInstanceObj || jsPlumbInstanceObj;
		rootMap.set(resource.id, resource);
		
		if (!jsPlumbInstanceObj.getContainer()) { 
			jsPlumbInstanceObj.setContainer($('#schemeArea' + resource.id));
		}
		renderDiagram(resource, resourcePage, resource.id, jsPlumbInstanceObj);
	}
	
	function attachToRoot(node, rootResource) {
		if (rootResource && rootResource.childTriggers && Array.isArray(rootResource.childTriggers)) {
			let children = rootResource.childTriggers;
			for (let i = 0; i < children.length; ++i) {
				if (children[i].name == node.name) {
					children[i] = node;
				}
			}
        }
	}
	
	function getAllChildIds(obj) {
	    let ids = [];

	    function traverse(node) {
	        if (node && node.childTriggers && Array.isArray(node.childTriggers)) {
	            node.childTriggers.forEach(child => {
	                ids.push(child.id);
	                traverse(child); // Recursively go deeper into childTriggers
	            });
	        }
	    }

	    traverse(obj);
	    return ids;
	}

	function emptyDataMap() {
		triggerMap.clear(); 
		parentMap.clear();
	}
	
	function clearInDataMap(triggerId) {
		triggerMap.delete("automationDiagram_" + triggerId); 
		parentMap.delete("automationDiagram_" + triggerId);
	}
	
	function clearNodesDataMap(nodes) {
		nodes.forEach(n => clearInDataMap(n));
	}
	
	function getNodesTriggerObject(node) {
		const triggerShape = node.closest('.triggerShape');
		const divId = triggerShape.attr('id');
		return triggerMap.get(divId);
	}
	
	function getNodesRootId(node) {
		const triggerRootContainer = node.closest('.triggerRootContainer');
		return triggerRootContainer.data('rootid');
	}
	
	
	function deleteNodes(trigger, jsPlumbInstance) {
		const children = getAllChildIds(trigger);
		
		clearInDataMap(trigger.id);
		clearNodesDataMap(children);
		
		if (children) {
			children.forEach(child => {
				const nodeId = "automationDiagram_" + child;
				
				jsPlumbInstance.removeAllEndpoints(nodeId); // Remove connections
			    document.getElementById(nodeId)?.remove(); // Remove from DOM
			});
		}
		
		
		const nodeId = "automationDiagram_" + trigger.id;
		
		jsPlumbInstance.removeAllEndpoints(nodeId); // Remove connections
	    document.getElementById(nodeId)?.remove(); // Remove from DOM
	}
	
	function clearModalHiddenFields() {
		$("#triggerResourceId").val("");
		$("#triggerParentId").val("");
		$("#triggerAttachmentId").val("");
	}


	legacyjQueryReadyFix(function() {
		
		
		
		$('#contentTriggers').load(uiPath + '/content/triggers-modal.html', function() {
				$('#contentAutomations').localize();
				
				var displaying = false;
				var typeButton = $('#typeButton').autoComplete({
					url: 'automations/tasks',
					nameIsResourceKey: true,
					valueAttr: 'resourceKey',
					nameAttr: 'resourceKey',
					resourceKeyTemplate: '{0}.label',
					getUrlData: function(data) {
						return data.resources;
					},
					changed: function(widget) {
						$('#automationProperties').empty();
						if(widget.getObject() && widget.getObject().value != '') {
							if(!displaying) {
							
								var o = widget.getObject();
								$('#automationProperties').propertyPage({ 
									url : 'automations/template/' +  widget.getObject().resourceKey + '/', 
									showButtons : false, 
									i18nNamespace: 'automations',
									useFilters: true,
									displayMode: o.displayMode,
									canUpdate : currentMenu.canUpdate, 
									useTemplates : true,
									propertyTabsLast: false,				
									urlProcessor: function(url) {
										return url.replace('$' + '{realmApi}', "currentRealm");
									}
								});
							}
						}
					}
				});
			
				
				$('div[dialog-for="contentTriggers"]').resourceDialog({
					resourceKey: 'automation',
					resourceUrl : "automations/trigger",
					divName: 'contentAutomations',
					showCreate: function() {
// 						$(document).data('triggerModalCallback').loadParent(null, null, 1);
					},
					showUpdate: function() {
// 						$(document).data('triggerModalCallback').loadParent(null, null, 1);
					},
					validate : function() {
						return $(document).data('triggerModalCallback').validate();
					},
					clearDialog : function(create) {
						$(document).data('triggerModalCallback').clearDialog(create);
					},
					createResource : function() {
						return $(document).data('triggerModalCallback').createResource();
					},
					displayResource : function(resource) {
// 						$(document).data('triggerModalCallback').loadParent(null, null, 1);
						$(document).data('triggerModalCallback').displayResource(resource);
					}
				});

				var resourcePage = $('#contentAutomations').ajaxResourcePage(
						{
							id : "Automation",
							tableUrl : "automations/table",
							title: getResource("automations.label"),
							infoHtml: getResource('automations.infoHtml'),
							icon: 'fa-clock',
							resourceUrl : "automations/automation",
							deleteResourcesUrl : "automations/bulk",
							fields : [ {
								name : "name"
							}],
							exportUrl: 'automations/export',
							importUrl: 'automations/import',
							resourceKey : "automation",
							canCreate: currentMenu.canCreate,
							canUpdate: currentMenu.canUpdate,
							canDelete: currentMenu.canDelete,
							checkbox : true,
							additionalActions: [{
								resourceKey : 'automationRunNow',
								iconClass : 'fa-play',
								action : function(resource, callback) {

									getJSON('automations/run/' + resource.id, null, function(data) {

									});
								},
								enabled : true
							}],
							validate : function() {
								if ($('#resourceName').val() == '') {
									showError("error.nameRequired");
									return false;
								}
								if(!$('#automationProperties').validateProperties()) {
									showError("error.correctValidationErrors");
									return false;
								}
								return true;
							},
							clearDialog : function(create) {
								
								$('#resourceId').val('');
								$('#resourceName').val('');
								typeButton.clear();			
								$('#automationProperties').empty();
								$('.tabPropertiesTab').first().trigger('click');
							},
							createResource : function() {
								resource = new Object();
								resource.id = $('#resourceId').val();
								resource.name = $('#resourceName').val();
								
								$('#automationProperties').saveProperties(true,
										function(items) {
											resource.properties = items;
								});
		
								resource.properties.push(new PropertyItem('resourceKey', typeButton.getValue()));
								
								return resource;
							},
							displayResource : function(resource, readOnly) {
								
								$('#resourceId').val(resource.id);
								$('#resourceName').val(resource.name);
								displaying = true;
								typeButton.setValue(resource.resourceKey, false);
								var task = typeButton.getObject();
								
								$('#automationProperties').empty();
								$('#automationProperties').propertyPage(
										{ url : 'automations/properties/' + resource.id, 
											showButtons : false, 
											i18nNamespace: 'automations',
											useFilters: true,
											displayMode: task ? task.displayMode : '',
											canUpdate : currentMenu.canUpdate && !readOnly,
											propertyTabsLast: false,				
											urlProcessor: function(url) {
												return url.replace('$' + '{realmApi}', "currentRealm");
											}
								});
								displaying = false;
							
							},
							complete : function() {
								loadComplete();
							},
							detailView: true,
							detailFormatter: function(index, resource, element) {
								elementMap.set(resource.id, { index, resource, element});
								drawFlowDiagram(index, resource, element);
							}
						});
				
				window.resourcePage = resourcePage;
		});

	});
	
	function renderDiagram(automation, resourcePage, rootId, jsPlumbInstance) {
		
		const dialogOptions = $('div[dialog-for="contentTriggers"]').data('options');

        // Ensure option resourceCreated does not exists before proceeding
        // this is needed to register resource created event hook
        if (dialogOptions && !dialogOptions.hasOwnProperty('resourceCreated')) {
            $.extend(dialogOptions, {
                resourceCreated: function(resourceGiven) {
                	// pull and update resource updated sent by server nad given here to event handler
                	const obj = elementMap.get(resourceGiven.id);
                	obj.resource = resourceGiven;
                	
                	if (obj.resource.id !== resourceGiven.id) {
                		throw new Error("Resource id mismatch.");
                	}
                	
                	drawFlowDiagram(obj.index, resourceGiven, obj.element, true);
                    
                }
            });
        }
        
// 		jsPlumb.empty($('#triggerView'));
		triggerList = [];
		if(automation) {

			$('#contentTrigger' + automation.id).show();
			$('#rootTrigger' + rootId).append(
					"<div style='top: 50px; left: 50px; position: absolute;' class='triggerShape triggerMain trigger-same-row' id='automationDiagram_" + automation.id + "'>"
				+	"	<div class='triggerContent'>"
				+	"		<span class='triggerText'>"	+ automation.name + "</span>"
				+	"		<a data-trigger='"+ automation.id + "' class='addTriggerIcon triggerIcon' href=''>"
				+	"			<i class='far fa-plus-circle'></i>"
				+	"		</a>"
				+	"	</div>"
				+	"</div>");
			
			triggerMap.set('automationDiagram_' + automation.id, automation);
			
			
			$('.addTriggerIcon').off('click');
			$('.addTriggerIcon').on('click', function(e) {
				e.preventDefault();
				
				clearModalHiddenFields();
				
				var automation = getNodesTriggerObject($(this));
				remoteCallStart();
				getJSON('triggers/taskResults/' + automation.resourceKey, null, function(data) {
					remoteCallStop();
					$(document).data('triggerModalCallback').loadParent(automation, null, 1);
					$('div[dialog-for="contentTriggers"]').resourceDialog('create');
				});
			});
        	
        	createTriggerList(automation.childTriggers);
        	var top = 125;
        	var left = 200;
        	if(triggerList.length > 0) {
        		remoteCallStart();
        		getState(triggerList, false, function(data){
        			remoteCallStop();
					resourceList = data.resources;
					$.each(automation.childTriggers, function(idx, obj) {
	        			addTask(obj, automation, top+50, left+50, rootId, jsPlumbInstance);	
	        		});
					jsPlumbInstance.draggable($('.triggerDraggable'));
					
					
					/*
					Loop over root keys to generate flow specfic div container jquery selector
					*/
					for (let key of rootMap.keys()) {
						
					    const container = '#triggerTasks' + key;
					    
					    $(container + ' .triggerDraggable').draggable({
					        stop: function(e){
					        	
								const trigger = getNodesTriggerObject($(this));
					        	
					            if(trigger){
					            	preferences = new Object();
					            	preferences.top = Math.round($(this).css('top').substring(0, $(this).css('top').length - 2));
					            	preferences.leftpx = Math.round($(this).css('left').substring(0, $(this).css('left').length - 2));
						            saveState($(this).attr('id'), preferences, false);
					            }
					        },
					        containment: container
					    });
					}
					
					$('.addIcon').off('click');
					$('.addIcon').on('click', function(e) {
						e.preventDefault();
						
						clearModalHiddenFields();
						
						const trigger = getNodesTriggerObject($(this));
						
						remoteCallStart();
						
						getJSON('triggers/parentEvents/' + trigger.id, null, function(data) {
							remoteCallStop();
							$(document).data('triggerModalCallback').loadParent(trigger, data.resources, 0);
							$('div[dialog-for="contentTriggers"]').resourceDialog('create');
						});
					});
					
					$('.editIcon').off('click');
					$('.editIcon').on('click', function(e) {
						e.preventDefault();
						
						
						const trigger = getNodesTriggerObject($(this));
						
						
						if(trigger.parentId==null) {
							// triggerModalCallback is used in triggers-modal
							const parentTrigger = parentMap.get('automationDiagram_' + trigger.id);
							$(document).data('triggerModalCallback').loadParent(parentTrigger, null, 1);	
							$('div[dialog-for="contentTriggers"]').resourceDialog('edit', trigger);
						} else {
							remoteCallStart();
							getJSON('triggers/parentEvents/' + trigger.parentId, null, function(data) {
								getJSON('triggers/trigger/' + trigger.parentId, null, function(parent) {
									remoteCallStop();
									// triggerModalCallback is used in triggers-modal
									$(document).data('triggerModalCallback').loadParent(parent, data.resources, 0);	
									$('div[dialog-for="contentTriggers"]').resourceDialog('edit', trigger);
								});
							});
						}
					});
					
					$('.deleteTriggerIcon').off('click');
					$('.deleteTriggerIcon').on('click', function(e) {
						e.preventDefault();
						
						const node = $(this);
						const rootId = getNodesRootId(node);
						const trigger = getNodesTriggerObject($(this));
	
						if(!trigger.isRoot) {
							bootbox.confirm(getResource("confirm.deleteTriggerItem").format(cleanValue(trigger.name)), function(result) {
								  if(result) {
									remoteCallStart();			
									deleteJSON('triggers/trigger/' + trigger.id, null, function(data) {
										remoteCallStop();
										if(data.success) {
										
											showSuccess(data.message);
											
											deleteNodes(trigger, jsPlumbInstance); 
											
											const rootResource = rootMap.get(rootId)
										    
										    const { index, resource, element } = elementMap.get(rootResource.id);
						                	
						                	if (resource.id !== rootResource.id) {
						                		throw new Error("Resource id mismatch.");
						                	}
						                	
						                	attachToRoot(data.resource, rootResource);
						                	
						                	drawFlowDiagram(index, rootResource, element, true);
										    
											resourcePage.refresh();
										} else {
											showError(data.message)
										}
									});
												
								  }
							}); 
						} else {
							bootbox.confirm(getResource("confirm.deleteTrigger").format(cleanValue(trigger.name)), function(result) {
								  if(result) {
									  remoteCallStart();
									  deleteJSON('automations/trigger/' + automation.id + '/' + trigger.id, null, function(data) {
										  remoteCallStop();	
										  if(data.success) {
												
												showSuccess(data.message);
												
												deleteNodes(trigger, jsPlumbInstance); 
												
												const rootResource = rootMap.get(rootId);
											    
											    const { index, resource, element } = elementMap.get(rootResource.id);
							                	
							                	if (resource.id !== rootResource.id) {
							                		throw new Error("Resource id mismatch.");
							                	}
							                	
							                	rootResource.childTriggers = [];
							                	
							                	drawFlowDiagram(index, rootResource, element, true);
											    
												resourcePage.refresh();
											} else {
												showError(data.message)
											}
										});
								  }
							}); 
						}
					});
        		});
        	}
		} else {
			$('#contentTrigger').hide();
		}
	}
	
	function getStateLabelClass(trigger) {
		var triggerClass = "label-info";
		if(trigger.result == 'EVENT_FAILURE') {
			triggerClass = "label-danger";
		}else if(trigger.result == 'EVENT_WARNING') {
			triggerClass = "label-warning";
		} else if(trigger.result == 'EVENT_SUCCESS') {
			triggerClass = "label-success";
		}
		
		return triggerClass;
	}
	
	function getStateLabelText(trigger) {
		var triggerText = "text.any";
		if(trigger.result == 'EVENT_FAILURE') {
			triggerText = "text.failure";
		}else if(trigger.result == 'EVENT_WARNING') {
			triggerText = "text.warning";
		} else if(trigger.result == 'EVENT_SUCCESS') {
			triggerText = "text.success";
		}
		
		return triggerText;
	}
	
	function getStateClass(trigger) {
		
		var triggerClass = "trigger-any";
		if(trigger.result == 'EVENT_FAILURE') {
			triggerClass = "trigger-failure";
		}else if(trigger.result == 'EVENT_WARNING') {
			triggerClass = "trigger-warning";
		} else if(trigger.result == 'EVENT_SUCCESS') {
			triggerClass = "trigger-success";
		}
		
		return triggerClass;
	}
	
	function createTriggerList(childTriggers){
		if(childTriggers) {
			$.each(childTriggers, function(index, triggerValue){
				triggerList.push('automationDiagram_' + triggerValue.id);
				if(triggerValue.childTriggers && triggerValue.childTriggers.length){
					createTriggerList(triggerValue.childTriggers);
				}
			});
		}
	}
	
	function addTask(trigger, parent, top, left, rootId, jsPlumbInstance) {
		var triggerClass = "blueTrigger";
		if(trigger.result == 'EVENT_FAILURE') {
			triggerClass = "redTrigger";
		}else if(trigger.result == 'EVENT_WARNING') {
			triggerClass = "yellowTrigger";
		} else if(trigger.result == 'EVENT_SUCCESS') {
			triggerClass = "greenTrigger";
		}
		$.each(resourceList, function(index, value){
			var preferences = JSON.parse(value.preferences);
			if(value.name == 'automationDiagram_' + trigger.id){
				top = preferences.top;
				left = preferences.leftpx;
				return false;
			}
		});
		
		$('#rootTrigger' + rootId).append(
					"<div style='top: " + top + "px; left: " + left + "px; position: absolute;' class='triggerShape triggerSub triggerDraggable " + triggerClass + " trigger-same-row' id='automationDiagram_" + trigger.id + "'>"
				+	"	<div class='triggerContent'>"
				+	"		<span class='triggerText'>"	+ trigger.name + "</span>"
				+	"		<a data-trigger='"+ trigger.id + "' class='addIcon triggerIcon' href=''>"
				+	"			<i class='far fa-plus-circle'></i>"
				+	"		</a>"
				+	"		<a data-trigger='" + trigger.id + "' class='editIcon triggerIcon' href=''>"
				+	"			<i class='far fa-edit'></i>"
				+	"		</a>"
				+	"		<a data-trigger='" + trigger.id + "' class='deleteTriggerIcon triggerIcon' href=''>"
				+	"			<i class='far fa-trash'></i>"
				+	"		</a>"
				+	"	</div>"
				+	"</div>");
		
		
		triggerMap.set('automationDiagram_' + trigger.id, trigger);
		parentMap.set('automationDiagram_' + trigger.id, parent);
		
		if(parent) {
			jsPlumbInstance.connect({
		           source:"automationDiagram_" + parent.id,
		           target:"automationDiagram_" + trigger.id,
		           connector: 'Flowchart',
		           anchor: "AutoDefault",
		           endpoint:"Blank",
		           detachable:false,
		           overlays:[["Arrow", {location: 1}]]
		       });	
		}
		
		top+= 50;
		if(trigger.childTriggers) {
			$.each(trigger.childTriggers, function(idx, childTrigger) {
				left+=175;
				addTask(childTrigger, trigger, top, left, rootId, jsPlumbInstance);
			});
		}
		
		
	}
</script>
<script src="${uiPath}/js/jquery.jsPlumb-1.7.5.min.js"></script>
